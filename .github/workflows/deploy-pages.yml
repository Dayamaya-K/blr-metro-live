# Deploys the site to GitHub Pages via Actions instead of the legacy
# "deploy from a branch" build.
#
# Two reasons to prefer this:
#  1. It skips Jekyll entirely — the repo is already a plain static site.
#  2. Commits pushed by the data workflows use GITHUB_TOKEN, which does NOT
#     trigger a `push` build. The `workflow_run` trigger below catches those,
#     so refreshed timetables/news/signals actually reach the live site.
#
# Requires: Settings -> Pages -> Source = "GitHub Actions".
name: Deploy to Pages

on:
  push:
    branches: [main]
  # Only the daily data refresh needs a redeploy. The 15-minute disruption
  # scan deliberately does NOT trigger one: the page reads signals.json and
  # advisories.json from raw.githubusercontent.com instead, which is live in
  # ~5 min instead of the 10+ min a Pages deploy takes here — and it keeps us
  # from queueing ~96 deploys a day behind each other.
  workflow_run:
    workflows: ["Refresh timetable data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never let two deploys race; queue them instead of cancelling, so a data
# refresh can't be dropped
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement:true turns Pages on automatically the first time this runs,
      # so there's no need to set Settings -> Pages -> Source by hand
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Publish only what the site actually serves. `path: .` would also tar
      # up .git, tools/ and .github/, which bloats the artifact for no reason.
      - name: Stage site files
        run: |
          mkdir -p _site
          cp -R index.html css js data _site/
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Default is 10 min, and Pages deploys on this repo have measured
          # 8-10+ min — runs #2 and #3 both died on "Timeout reached, aborting!"
          timeout: 1800000
